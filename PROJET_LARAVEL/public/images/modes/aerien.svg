<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Avion cargo rouge en vol au coucher du soleil</title>
  <desc>Illustration d'un avion cargo rouge et gris en montée devant un soleil jaune, au-dessus d'une piste et de conteneurs, avec le titre Cargo Intelligence.</desc>

  <defs>
    <clipPath id="fus">
      <path d="M110 152 L200 166 L470 166 C520 166 565 178 580 196 C572 214 540 224 500 224 L230 224 C180 224 140 200 110 170 Z"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="680" height="380" fill="#14151C"/>

  <!-- Soleil -->
  <circle cx="575" cy="95" r="58" fill="#FFC93C" opacity="0.3"/>
  <circle cx="575" cy="95" r="78" fill="none" stroke="#FFC93C" stroke-width="1.5" opacity="0.15"/>
  <circle cx="575" cy="95" r="98" fill="none" stroke="#FFC93C" stroke-width="1.5" opacity="0.08"/>

  <!-- Étoiles -->
  <circle cx="330" cy="38" r="1.5" fill="#E6E8EC" opacity="0.35"/>
  <circle cx="420" cy="70" r="1.5" fill="#E6E8EC" opacity="0.3"/>
  <circle cx="470" cy="32" r="1.5" fill="#E6E8EC" opacity="0.35"/>
  <circle cx="640" cy="215" r="1.5" fill="#E6E8EC" opacity="0.3"/>
  <circle cx="250" cy="96" r="1.5" fill="#E6E8EC" opacity="0.25"/>
  <circle cx="625" cy="40" r="1.5" fill="#E6E8EC" opacity="0.3"/>

  <!-- Traînées de vitesse -->
  <g stroke="#E6E8EC" stroke-width="3" stroke-linecap="round" opacity="0.18">
    <line x1="22" y1="205" x2="78" y2="205"/>
    <line x1="36" y1="222" x2="84" y2="222"/>
    <line x1="18" y1="239" x2="70" y2="239"/>
    <line x1="46" y1="256" x2="88" y2="256"/>
  </g>
  <g stroke="#FFC93C" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="52" y1="213" x2="80" y2="213"/>
    <line x1="30" y1="248" x2="56" y2="248"/>
  </g>

  <!-- Nuages discrets -->
  <rect x="560" y="150" width="90" height="4" rx="2" fill="#E6E8EC" opacity="0.07"/>
  <rect x="590" y="162" width="60" height="4" rx="2" fill="#E6E8EC" opacity="0.07"/>
  <rect x="40" y="130" width="40" height="4" rx="2" fill="#E6E8EC" opacity="0.07"/>

  <!-- AVION -->
  <g transform="rotate(-7 345 200)">
    <!-- Aile lointaine -->
    <path d="M400 168 L318 128 L292 128 L352 168 Z" fill="#E6E8EC" opacity="0.6"/>

    <!-- Fuselage -->
    <path d="M110 152 L200 166 L470 166 C520 166 565 178 580 196 C572 214 540 224 500 224 L230 224 C180 224 140 200 110 170 Z" fill="#D4201A"/>
    <g clip-path="url(#fus)">
      <rect x="100" y="206" width="500" height="30" fill="#0D0E13" opacity="0.25"/>
      <rect x="100" y="166" width="500" height="4" fill="#E6E8EC" opacity="0.22"/>
      <rect x="100" y="196" width="500" height="5" fill="#FFC93C"/>
      <rect x="350" y="174" width="64" height="20" fill="none" stroke="#0D0E13" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M518 178 L546 180 Q554 183 557 189 L522 188 Z" fill="#14151C"/>
    </g>
    <text x="190" y="190" font-family="Archivo, 'Arial Black', sans-serif" font-weight="900" font-size="17" letter-spacing="5" fill="#E6E8EC">CARGO</text>

    <!-- Dérive -->
    <path d="M128 158 L104 86 L142 86 L226 166 Z" fill="#E6E8EC"/>
    <path d="M103.6 86 L142 86 L150.4 94 L106.4 94 Z" fill="#D4201A"/>

    <!-- Plan horizontal arrière -->
    <path d="M196 214 L132 226 L108 226 L150 198 Z" fill="#E6E8EC"/>

    <!-- Aile principale -->
    <path d="M410 214 L252 292 L204 292 L312 222 Z" fill="#E6E8EC"/>
    <path d="M252 292 L204 292 L216 280 L240 280 Z" fill="#D4201A"/>

    <!-- Moteur 1 -->
    <rect x="321" y="241" width="58" height="22" rx="11" fill="#E6E8EC"/>
    <rect x="336" y="241" width="8" height="22" fill="#D4201A"/>
    <ellipse cx="377" cy="252" rx="5" ry="11" fill="#FFC93C"/>
    <ellipse cx="378" cy="252" rx="2.5" ry="7" fill="#14151C"/>

    <!-- Moteur 2 -->
    <rect x="258" y="274" width="52" height="20" rx="10" fill="#E6E8EC"/>
    <rect x="272" y="274" width="7" height="20" fill="#D4201A"/>
    <ellipse cx="308" cy="284" rx="4.5" ry="10" fill="#FFC93C"/>
    <ellipse cx="309" cy="284" rx="2.2" ry="6" fill="#14151C"/>
  </g>

  <!-- Piste -->
  <rect x="0" y="345" width="680" height="35" fill="#0D0E13"/>

  <!-- Tour de contrôle -->
  <rect x="52" y="292" width="26" height="12" fill="#0D0E13"/>
  <rect x="60" y="304" width="10" height="41" fill="#0D0E13"/>
  <rect x="55" y="296" width="20" height="3" fill="#FFC93C" opacity="0.7"/>

  <!-- Conteneurs -->
  <g fill="#0D0E13">
    <rect x="420" y="331" width="28" height="14"/>
    <rect x="450" y="331" width="28" height="14"/>
    <rect x="480" y="331" width="28" height="14"/>
    <rect x="510" y="331" width="28" height="14"/>
    <rect x="540" y="331" width="28" height="14"/>
    <rect x="570" y="331" width="28" height="14"/>
    <rect x="600" y="331" width="28" height="14"/>
    <rect x="450" y="317" width="28" height="14"/>
    <rect x="480" y="317" width="28" height="14"/>
    <rect x="540" y="317" width="28" height="14"/>
    <rect x="570" y="317" width="28" height="14"/>
    <rect x="480" y="303" width="28" height="14"/>
    <rect x="570" y="303" width="28" height="14"/>
  </g>
  <rect x="510" y="317" width="28" height="14" fill="#D4201A" opacity="0.55"/>
  <rect x="540" y="303" width="28" height="14" fill="#FFC93C" opacity="0.5"/>
  <rect x="450" y="303" width="28" height="14" fill="#E6E8EC" opacity="0.18"/>

  <!-- Ligne de piste -->
  <line x1="0" y1="363" x2="680" y2="363" stroke="#FFC93C" stroke-width="3" stroke-dasharray="24 16"/>

  <!-- Titre -->
  <text x="40" y="56" font-family="Archivo, 'Arial Black', sans-serif" font-weight="900" font-size="26" letter-spacing="2" fill="#FFC93C">CARGO INTELLIGENCE</text>
  <rect x="40" y="65" width="44" height="3" fill="#D4201A"/>
  <text x="40" y="88" font-family="Archivo, 'Arial Black', sans-serif" font-weight="700" font-size="13" letter-spacing="5" fill="#E6E8EC">AIR FREIGHT &amp; CARGO</text>
</svg>